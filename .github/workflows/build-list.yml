name: Build spam list

on:
  schedule:
    # Hourly. The first day or so fills in the last 30 days in pieces,
    # because the FTC API allows a limited number of requests per hour.
    # After that, most runs find nothing new and finish in seconds.
    - cron: "40 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "build_spam_list.py"
      - ".github/workflows/build-list.yml"

permissions:
  contents: write

concurrency:
  group: build-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Restore downloaded days
        uses: actions/cache/restore@v4
        with:
          path: daily
          key: daily-${{ github.run_id }}
          restore-keys: daily-
      - name: Build list from FTC data
        env:
          FTC_API_KEY: ${{ secrets.FTC_API_KEY }}
        run: python build_spam_list.py spamlist.txt daily
      - name: Save downloaded days
        if: always()
        uses: actions/cache/save@v4
        with:
          path: daily
          key: daily-${{ github.run_id }}
      - name: Publish if changed
        run: |
          if [ ! -f spamlist.txt ]; then echo "No list yet."; exit 0; fi
          head -3 spamlist.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spamlist.txt
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Update spam list $(date -u +%F)"
            # Someone may have pushed while this job ran; replay on top of it.
            git pull --rebase origin main
            git push
          fi
