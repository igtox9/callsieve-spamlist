name: Build spam list

on:
  schedule:
    # Weekdays 17:40 UTC. The FTC usually posts each day's file by noon Eastern.
    - cron: "40 17 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "build_spam_list.py"
      - ".github/workflows/build-list.yml"

permissions:
  contents: write

concurrency:
  group: build-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build list from FTC data
        run: python build_spam_list.py spamlist.txt
      - name: Publish if changed
        run: |
          head -3 spamlist.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spamlist.txt
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Update spam list $(date -u +%F)"
            git push
          fi
