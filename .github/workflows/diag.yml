name: Diagnose FTC access
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/diag.yml"]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: API shape with a date filter
        run: |
          curl -sS -D /tmp/h.txt -o /tmp/b.json -w 'HTTP %{http_code} %{size_download}\n' "https://api.ftc.gov/v0/dnc-complaints?api_key=DEMO_KEY&items_per_page=2&created_date=%222026-11-17%22" || true
          echo "BODY:"; cat /tmp/b.json; echo
          echo "HEADERS:"; grep -i -E "ratelimit|retry|content-type" /tmp/h.txt || true
          curl -sS -o /tmp/c.json -w 'HTTP %{http_code}\n' "https://api.ftc.gov/v0/dnc-complaints?api_key=DEMO_KEY&items_per_page=50&offset=50&created_date=%222026-11-17%22&sort_order=ASC" || true
          python3 -c "
          import json; d=json.load(open('/tmp/c.json')); print('META', d.get('meta')); print('N', len(d.get('data',[]))); print('FIRST', d['data'][0]['attributes'] if d.get('data') else None)"
